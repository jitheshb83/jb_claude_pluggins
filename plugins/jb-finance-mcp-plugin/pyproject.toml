[project]
name = "jb-finance-mcp-plugin"
version = "0.1.0"
description = "Skill scripts for jb-finance-mcp-plugin — depends on jb_gateway_mcp as a library."
requires-python = ">=3.13"
dependencies = [
    "jb-gateway-mcp @ git+https://github.com/jitheshb83/jb_gateway_mcp.git",
    "httpx>=0.28.1",
    # credit-card statement PDFs (data/cards/) — positional text extraction;
    # the statement has two right-aligned amount columns a flat text dump
    # collapses into indistinguishable trailing numbers.
    "pdfplumber>=0.11.4",
]

[tool.uv]
package = false
